name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q HinduraAI.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: HinduraAI
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp HinduraAI/app/build/outputs/apk/debug/app-debug.apk HinduraAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HinduraAI-apk
          path: HinduraAI.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hindura AI (latest build)
          files: HinduraAI.apk
